<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive, in-depth tutorial on non-autoregressive System 1 decision engines, using Laya as the reference implementation."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>System 1 Decision Engines</title>
    <script>
      // Set the theme before first paint so a dark-mode reader never sees a light flash.
      (function () {
        var theme = null;
        try {
          theme = JSON.parse(localStorage.getItem("s1-tutorial:theme"));
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
